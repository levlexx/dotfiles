##### =========================================================
##### tmux — capsule style / Tokyo Night / Ghostty / macOS
##### with git + icons
##### =========================================================

##### ----- Terminal / rendering -----
set -g default-terminal "tmux-256color"
set -as terminal-features "xterm-256color:RGB"
set -as terminal-features "xterm-ghostty:RGB"
set -g allow-passthrough on
set -sg escape-time 0
set -g focus-events on
set -g extended-keys on
set -g set-clipboard on

##### ----- General -----
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g repeat-time 300
set -g display-time 2000
# was set by tmux-sensible: emacs keys in the : prompt (tmux picks vi from
# $EDITOR otherwise) and per-client window sizing
set -g status-keys emacs
setw -g aggressive-resize on

##### ----- Prefix -----
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### ----- Reload -----
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

##### ----- Splits -----
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

##### ----- Pane navigation -----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### ----- Pane resize -----
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### ----- Windows / panes -----
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window
bind Tab last-window
# C-a a: kept from tmux-sensible
bind a last-window
bind x kill-pane
bind X kill-window
bind m resize-pane -Z
# Space is taken by tmux-which-key; next-layout lives on y
unbind Space
bind y next-layout

##### ----- Agent windows -----
# Bell = agent needs attention; bell-flagged windows render red/bold via the
# window-status-bell-style below.
set -g bell-action any
set -g visual-bell off
setw -g monitor-bell on

# toggle to last session
bind S switch-client -l

# agent split: Claude in a 40% pane on the right (keeps the ✳ state hooks)
bind A split-window -h -l 40% -c "#{pane_current_path}" claude
# parallel agent: Claude in its own git worktree (.claude/worktrees/<name>,
# branch worktree-<name>) in a new window named after it
bind W command-prompt -p " worktree:" "new-window -c '#{pane_current_path}' -n '%1' 'claude -w %1'"

##### ----- Popups -----
set -g popup-border-lines rounded
set -g popup-border-style "fg=#7aa2f7"
set -g popup-style "bg=#1a1b26"

bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" -T " lazygit " lazygit
# scratch shell popup; same key hides it again (see scripts/scratch.sh)
bind t run-shell "~/.tmux/scripts/scratch.sh '#{session_name}' '#{pane_current_path}' '#{client_name}'"
# sesh: fuzzy picker over tmux sessions, sesh.toml and zoxide dirs
bind o run-shell "~/.tmux/scripts/sesh-picker.sh"

##### ----- Copy mode / vi -----
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
set -g mode-style "bg=#283457,fg=#c0caf5"
set -g copy-mode-match-style "bg=#3d59a1,fg=#c0caf5"
set -g copy-mode-current-match-style "bg=#ff9e64,fg=#1a1b26,bold"
bind ] run-shell "pbpaste | tmux load-buffer - && tmux paste-buffer"

##### ----- Messages -----
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g message-command-style "bg=#292e42,fg=#7aa2f7"
# render messages / command prompt as a capsule matching the window tabs
set -g message-format "#[fg=#292e42,bg=default]#[#{?#{command_prompt},#{E:message-command-style},#{E:message-style}}]#{message}#[fg=#292e42,bg=default] "
set -g prompt-cursor-colour "#7aa2f7"

##### ----- Pane borders -----
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-lines single
set -g pane-border-indicators arrows
# pane title (command · dir), shown only once a window is split
set -g pane-border-format "#{?pane_active,#[fg=#7aa2f7#,bold],#[fg=#565f89]} #{pane_current_command} #[nobold]· #{b:pane_current_path} "
set-hook -g window-layout-changed 'setw -F pane-border-status "#{?#{==:#{window_panes},1},off,top}"'

# dim inactive panes (nvim paints its own bg, so it stays undimmed)
set -g window-style "bg=#16161e"
set -g window-active-style "bg=#1a1b26"

##### ----- Status base -----
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 30
set -g status-left-length 30
set -g status-right-length 150
set -g status-style "bg=default,fg=#a9b1d6"

##### ----- Auto rename -----
setw -g automatic-rename on
# claude's process title is its version (2.1.x), hence the regex
set -g automatic-rename-format "#{?#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}},󰚩 claude,#{?#{==:#{pane_current_command},nvim}, nvim,#{?#{==:#{pane_current_command},vim}, vim,#{?#{==:#{pane_current_command},lazygit}, git,#{?#{==:#{pane_current_command},k9s},󱃾 k9s,#{?#{==:#{pane_current_command},lazydocker}, docker,#{?#{m:*sh,#{pane_current_command}}, #{b:pane_current_path},#{pane_current_command}}}}}}}}"

##### ----- Left capsule -----
set -g status-left "#[fg=#7aa2f7,bg=default]#[fg=#1a1b26,bg=#7aa2f7,bold]#S#[fg=#7aa2f7,bg=default] "

# over SSH, prefix the session capsule with the host
if-shell '[ -n "$SSH_CONNECTION" ]' {
  set -g status-left-length 50
  set -g status-left "#[fg=#bb9af7,bg=default]#[fg=#1a1b26,bg=#bb9af7,bold]#h#[fg=#bb9af7,bg=default] #[fg=#7aa2f7,bg=default]#[fg=#1a1b26,bg=#7aa2f7,bold]#S#[fg=#7aa2f7,bg=default] "
}

##### ----- Window capsules -----
setw -g window-status-separator ""
setw -g window-status-style "bg=default,fg=#565f89"

# inactive
setw -g window-status-format "#[fg=#292e42,bg=default]#[fg=#7aa2f7,bg=#292e42]#I #[fg=#c0caf5,bg=#292e42]#W#{?window_zoomed_flag, 󰊓,}#{?#{==:#{@claude_state},working}, #[fg=#f7768e]#[bold]✳#[nobold],#{?#{==:#{@claude_state},done}, #[fg=#9ece6a]#[bold]✳#[nobold],}}#[fg=#292e42,bg=default] "

# active
setw -g window-status-current-style ""
setw -g window-status-current-format "#[fg=#7aa2f7,bg=default]#[fg=#1a1b26,bg=#7aa2f7,bold]#I #[fg=#1a1b26,bg=#7aa2f7,bold]#W#{?window_zoomed_flag, 󰊓,}#{?#{==:#{@claude_state},working}, #[fg=#7f1d1d]✳,#{?#{==:#{@claude_state},done}, #[fg=#14532d]✳,}}#[fg=#7aa2f7,bg=default] "

setw -g window-status-last-style "fg=#a9b1d6"
setw -g window-status-bell-style "bg=#f7768e,fg=#1a1b26,bold"
setw -g window-status-activity-style "fg=#e0af68"

##### ----- Right side -----
# mode/prefix indicators + time capsule
set -g status-right "#{?pane_in_mode,#[fg=#e0af68]#[bg=default]#[nobold]#[fg=#1a1b26]#[bg=#e0af68]#[bold]COPY#[fg=#e0af68]#[bg=default]#[nobold] ,}#{?client_prefix,#[fg=#f7768e]#[bg=default]#[nobold]#[fg=#1a1b26]#[bg=#f7768e]#[bold]PREFIX#[fg=#f7768e]#[bg=default]#[nobold] ,}#(~/.tmux/scripts/kube-context.sh)#{claude_usage}#[fg=#292e42,bg=default]#[fg=#7aa2f7,bg=#292e42,bold]%H:%M#[fg=#292e42,bg=default]"

##### ----- Clock -----
setw -g clock-mode-colour "#7aa2f7"

##### ----- Plugins (TPM) -----
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'alexwforsythe/tmux-which-key'

##### ----- Plugin settings -----
set -g @continuum-save-interval '10'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
# fingers only parses named/colourNNN colours, not hex
set -g @fingers-key F
set -g @fingers-hint-style "fg=colour215,bold"
set -g @fingers-highlight-style "fg=colour117"
set -g @fingers-backdrop-style "fg=colour60"

##### ----- Local plugins -----
# Claude usage capsule (harvester feeds ~/.cache/claude-usage/usage)
run '~/.tmux/claude-usage/claude-usage.tmux'
# tmux-fingers comes from Homebrew, not TPM
run 'tmux-fingers load-config'

run '~/.tmux/plugins/tpm/tpm'
