name: check

# Catch what used to surface only on the second Mac: shell bugs, Lua
# formatting, typos, tmux config errors and nvim startup errors.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        # tree-sitter-cli: nvim-treesitter compiles parsers with it (mise
        # provides it on the Macs)
        run: brew install shellcheck typos-cli stylua tmux neovim tree-sitter-cli

      - name: shellcheck
        run: |
          shellcheck -S warning \
            tmux/claude-usage/scripts/*.sh \
            tmux/claude-usage/claude-usage.tmux \
            tmux/scripts/*.sh \
            claude/bin/ccp \
            claude/hooks/format.sh \
            scripts/doctor.sh \
            git/.config/git/hooks/*

      - name: zsh syntax
        run: |
          zsh -n zsh/.zshrc
          zsh -n zsh/gcloud.zsh
          zsh -n bootstrap.sh

      - name: typos
        run: typos

      - name: stylua
        run: stylua --check nvim/.config/nvim

      - name: tmux config loads
        run: |
          mkdir -p ~/.tmux
          ln -s "$PWD/tmux/claude-usage" ~/.tmux/claude-usage
          ln -s "$PWD/tmux/scripts" ~/.tmux/scripts
          tmux -L ci -f /dev/null new-session -d -s ci
          # source-file fails on parse errors; missing plugins only log
          tmux -L ci source-file tmux/.tmux.conf
          tmux -L ci show -g status-left >/dev/null
          tmux -L ci kill-server

      - name: nvim starts without errors
        run: |
          mkdir -p ~/.config
          ln -s "$PWD/nvim/.config/nvim" ~/.config/nvim
          # first start installs plugins (vim.pack is synchronous), then the
          # parsers with an explicit wait, then the real check
          nvim --headless +qa || true
          nvim --headless \
            "+lua require('nvim-treesitter').install(require('plugins.treesitter').parsers):wait(600000)" +qa
          nvim --headless "+lua vim.defer_fn(function()
            local out = vim.api.nvim_exec2('messages', { output = true }).output
            io.stdout:write(out .. '\n')
            vim.cmd(out:find('Error') and 'cquit 1' or 'qa!')
          end, 5000)"
