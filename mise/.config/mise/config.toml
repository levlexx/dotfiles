[tools]
node = "24.18.0"
go = "1.26.4"
"npm:@biomejs/biome" = "2.5.0"
"npm:prettier" = "3.8.4"
"npm:@vtsls/language-server" = "0.3.0"
# typescript-language-server backs Claude Code's typescript-lsp plugin (nvim
# uses vtsls); global typescript is only the fallback, projects use their own
"npm:typescript-language-server" = "6.0.3"
"npm:typescript" = "6.0.3"
"npm:@angular/language-server" = "22.0.4"
"npm:@typespec/compiler" = "1.13.0"
# GitHub release binary via ubi (handles the .gz single-binary asset and the
# exec bit): the npm package needs a postinstall-downloaded native binary that
# breaks on machines with stale system-node globals
"ubi:tree-sitter/tree-sitter" = { version = "0.26.9", exe = "tree-sitter" }
"npm:vscode-langservers-extracted" = "4.10.0"
"npm:yaml-language-server" = "1.23.0"
"npm:dockerfile-language-server-nodejs" = "0.15.0"
"npm:@microsoft/compose-language-service" = "0.5.0"
"aqua:LuaLS/lua-language-server" = "3.18.2"
"aqua:JohnnyMorganz/StyLua" = "2.5.2"
"aqua:k3d-io/k3d" = "5.9.0"
"aqua:kubernetes/kubectl" = "1.36.2"
"aqua:derailed/k9s" = "0.51.0"
"aqua:helm/helm" = "3.21.2"
"aqua:kubernetes-sigs/kustomize" = "5.8.1"
"aqua:jesseduffield/lazydocker" = "0.25.2"
"aqua:jesseduffield/lazygit" = "0.62.2"
# Cloud SQL Auth Proxy (Postgres/MySQL on localhost)
"aqua:GoogleCloudPlatform/cloud-sql-proxy" = "2.27.0"
# DigitalOcean CLI
"aqua:digitalocean/doctl" = "2.1.0"
# HTTP load generator with a live TUI (profile under load: oha + gprof)
"aqua:hatoo/oha" = "1.16.0"
# diagrams as code (diag), DB docs + ER diagrams from a live database
"aqua:terrastruct/d2" = "0.9.0"
"aqua:k1LoW/tbls" = "1.96.1"
# log viewer (JSON slog / Cloud Logging formats in lnav/formats)
"github:tstack/lnav" = "0.14.1"
# go test with readable output, watch mode, slowest tests
"aqua:gotestyourself/gotestsum" = "1.13.0"
# encrypted secrets in repos (sopsinit, direnv use_sops)
"aqua:getsops/sops" = "3.13.3"
"aqua:FiloSottile/age" = "1.3.2"
# git absorb: fold staged fixes into the right earlier commits
"aqua:tummychow/git-absorb" = "0.9.0"
"aqua:tilt-dev/tilt" = "0.37.4"
"aqua:go-task/task" = "3.51.1"
"aqua:crate-ci/typos" = "1.48.0"
"npm:@commitlint/cli" = "21.2.0"
"ubi:Automattic/harper" = { version = "2.6.0", exe = "harper-ls", matching = "harper-ls" }
"ubi:errata-ai/vale-ls" = { version = "0.4.0", exe = "vale-ls" }
uv = "latest"
[env]
GOBIN = "{{env.HOME}}/go/bin"
JS_DEBUG_ADAPTER = "{{env.HOME}}/.local/share/vscode-js-debug/dist/src/dapDebugServer.js"

[tasks.install-go-tools]
description = "Install Go developer tools with the mise-managed Go runtime"
run = '''
set -eu

export GOBIN="$HOME/go/bin"
mkdir -p "$GOBIN"

echo "go: $(command -v go)"
go version
echo "GOBIN: $GOBIN"

go install golang.org/x/tools/gopls@latest
go install golang.org/x/tools/cmd/goimports@latest
go install mvdan.cc/gofumpt@latest
go install honnef.co/go/tools/cmd/staticcheck@latest
go install github.com/go-delve/delve/cmd/dlv@latest
go install golang.org/x/vuln/cmd/govulncheck@latest
# before/after benchmark statistics (gbench)
go install golang.org/x/perf/cmd/benchstat@latest
# package dependency graph / call graph (diag deps, diag calls)
go install github.com/loov/goda@latest
go install github.com/ofabry/go-callvis@latest

# Keep golangci-lint under the same mise-managed Go toolchain instead of using
# Homebrew or a curl installer.
go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
'''

[tasks.install-js-debug-adapter]
description = "Install Microsoft's JavaScript debug adapter with the mise-managed Node runtime"
run = '''
set -eu

target="${JS_DEBUG_DIR:-$HOME/.local/share/vscode-js-debug}"
repo="https://github.com/microsoft/vscode-js-debug.git"

mkdir -p "$(dirname "$target")"

if [ -d "$target/.git" ]; then
  git -C "$target" pull --ff-only
else
  rm -rf "$target"
  git clone --depth 1 "$repo" "$target"
fi

cd "$target"
npm ci --ignore-scripts
npx gulp dapDebugServer

test -f "$target/dist/src/dapDebugServer.js"
printf 'JS debug adapter: %s\n' "$target/dist/src/dapDebugServer.js"
'''

[tasks.doctor]
description = "Check this machine against the dotfiles repo (links, packages, Claude, tmux, fonts)"
run = "~/dotfiles/scripts/doctor.sh"

[tasks.versions]
description = "Print runtime, Go tool, and editor tool versions"
run = '''
set -u

show_path() {
  name="$1"
  printf '%s path: ' "$name"
  if command -v "$name" >/dev/null 2>&1; then
    command -v "$name"
  else
    echo 'MISSING'
  fi
}

section() {
  printf '\n== %s ==\n' "$1"
}

section go
show_path go
printf 'GOBIN: %s\n' "${GOBIN:-unset}"
if command -v go >/dev/null 2>&1; then
  go version
fi

section gopls
show_path gopls
if command -v gopls >/dev/null 2>&1; then
  gopls version
fi

section gofumpt
show_path gofumpt
if command -v gofumpt >/dev/null 2>&1; then
  gofumpt -version 2>/dev/null || gofumpt --version
fi

section goimports
show_path goimports
if command -v goimports >/dev/null 2>&1; then
  go version -m "$(command -v goimports)" | sed -n '1,20p'
fi

section staticcheck
show_path staticcheck
if command -v staticcheck >/dev/null 2>&1; then
  staticcheck -version
fi

section dlv
show_path dlv
if command -v dlv >/dev/null 2>&1; then
  dlv version
fi

section govulncheck
show_path govulncheck
if command -v govulncheck >/dev/null 2>&1; then
  govulncheck -version
fi

section golangci-lint
show_path golangci-lint
if command -v golangci-lint >/dev/null 2>&1; then
  golangci-lint version
fi

section editor-tools
for tool in \
  biome \
  prettier \
  stylua \
  lua-language-server \
  ngserver \
  vtsls \
  tsp \
  tsp-server \
  tree-sitter \
  vscode-json-language-server \
  yaml-language-server \
  docker-langserver \
  docker-compose-langserver \
  k3d \
  kubectl \
  k9s \
  helm \
  kustomize \
  lazydocker \
  lazygit \
  tilt
do
  show_path "$tool"
done

section js-debug-adapter
printf 'JS_DEBUG_ADAPTER: %s\n' "${JS_DEBUG_ADAPTER:-unset}"
if [ -f "${JS_DEBUG_ADAPTER:-}" ]; then
  echo 'adapter file: OK'
else
  echo 'adapter file: MISSING'
fi
'''

[tasks.nvim-parsers]
description = "Rebuild all Neovim treesitter parsers from scratch (fixes 'Error during tree-sitter build' after branch/grammar changes)"
run = '''
set -eu

if ! command -v cc >/dev/null 2>&1; then
  echo "error: no C compiler; run: xcode-select --install" >&2
  exit 1
fi

# nvim-treesitter main builds with the tree-sitter CLI; a stale npm-global
# shim (node /lib/node_modules/...) breaks with ENOENT
if ! tree-sitter --version >/dev/null 2>&1; then
  echo "error: tree-sitter CLI missing or broken ($(command -v tree-sitter || echo 'not on PATH'))" >&2
  echo "fix: mise install   (provides npm:tree-sitter-cli)" >&2
  exit 1
fi

rm -rf "$HOME/.local/share/nvim/site/parser" "$HOME/.local/share/nvim/site/queries"

nvim --headless \
  "+lua require('nvim-treesitter').install(require('plugins.treesitter').parsers):wait(600000)" \
  +qa

echo "parsers rebuilt; kulala installs its own on next nvim start"
'''

[tasks.nvim-startuptime]
description = "Measure Neovim startup time"
run = '''
set -eu

log="${NVIM_STARTUPTIME_LOG:-/tmp/nvim-startup.log}"
nvim --startuptime "$log" +qa
printf 'Neovim startup log: %s\n' "$log"
'''
